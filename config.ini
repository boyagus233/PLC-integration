[SYSTEM_CONFIG]
; ============================================================
; CONFIG UTAMA SERVER BACKEND
; Cukup ubah BASE_URL 1 baris ini jika domain server berganti!
; ============================================================
BASE_URL = https://api.pms.yuasa.seavihive.com

[SCANNER_CONFIG]
ENABLE = no
LINE_NO = 14
PORT_SCANNER = COM3
BAUD_RATE = 9600
API_URL = /api/fix-scanner
; --- Mode REMOVE FROM MASTERBOX ---
REMOVE_MONITOR_ADDRESS =
REMOVE_API_URL = /api/fix-scanner-remove-from-masterbox

[SCANNER_CONFIG_2]
; ============================================================
; CONFIG UNTUK SCANNER 2 (POS QC 2 - jika memakai 2 scanner)
; ============================================================
ENABLE = no
LINE_NO = 14
PORT_SCANNER = COM4
BAUD_RATE = 9600
API_URL = /api/fix-scanner-masterbox-validate
REMOVE_MONITOR_ADDRESS =
REMOVE_API_URL = /api/fix-scanner-remove-from-masterbox


[DOWNTIME_CONFIG]
ENABLE = yes
LINE_NO = 2
API_URL = /api/fix-scanner-downtime
DOWNTIME_LOG_FILENAME = downtime_log.txt
SAVE_LOCATION = desktop

; --- Pilihan CONNECTION_MODE (Mode Koneksi PLC) ---
; cx_programmer : Membaca dari layar Watch Window CX-Programmer
; serial        : Membaca langsung dari kabel RS232-C (Omron HostLink)
; rockwell      : Membaca langsung via LAN/Ethernet (Allen-Bradley)
CONNECTION_MODE = serial

; Konfigurasi Port PLC (dipakai jika mode 'serial')
PLC_PORT = COM13
PLC_BAUD = 9600
PLC_IP = 192.168.1.10

; Alamat PLC dan Nama Mesin (Format: KODE_MESIN:ALAMAT_BIT:NAMA_MESIN)
DOWNTIME_ADDRESSES = MC1:0.00:Mesin 1, MC2:0.01:Mesin 2, MC3:0.02:Mesin 3, MC4:0.03:Mesin 4, MC5:0.04:Mesin 5, MC6:0.05:Mesin 6, MC7:0.06:Mesin 7, MC8:0.07:Mesin 8, MC9:0.08:Mesin 9, MC10:0.09:Mesin 10, MC11:0.10:Mesin 11, MC12:0.11:Mesin 12, MC13:0.12:Mesin 13

[PRINTER_CONFIG]
; ============================================================
; CONFIG AUTO PRINT PALLET
; ============================================================
ENABLE = yes

; --- Pilihan CONNECTION_MODE (Mode Koneksi PLC) ---
; cx_programmer : Membaca bit sensor dari CX-Programmer
; serial        : Membaca bit sensor lewat RS232-C (Omron)
; rockwell      : Membaca TAG sensor via LAN/Ethernet (Allen-Bradley)
CONNECTION_MODE = rockwell
PLC_IP = 192.168.1.20/1

; --- MONITOR_ADDRESS ---
; Jika mode Omron: isi alamat bit (contoh: 0.05)
; Jika mode Rockwell: isi nama TAG PLC (contoh: _IO_EM_DI_01)
MONITOR_ADDRESS = _IO_EM_DI_01

PRINTER_NAME = TSC TL241
API_URL = /api/fix-scanner-pallet
RETRY_API_URL = /api/fix-scanner-pallet-retry
API_LINE_NO = 14
LABEL_LINE_NO = 01
LABEL_WIDTH = 70
LABEL_HEIGHT = 50
LABEL_GAP = 2
LABEL_ORIENTATION = portrait

[TIMBANGAN_CONFIG]
; ============================================================
; CONFIG AUTO PRINT MASTER BOX
; ============================================================
ENABLE = no
LINE_NO = 14
API_URL = /api/fix-scanner-masterbox
RETRY_API_URL = /api/fix-scanner-masterbox-retry
LABEL_WIDTH = 70
LABEL_HEIGHT = 50
LABEL_GAP = 2
LABEL_ORIENTATION = portrait

; --- Pilihan CONNECTION_MODE (Mode Koneksi PLC) ---
; Sama seperti Printer: cx_programmer, serial, atau rockwell
CONNECTION_MODE = rockwell
PLC_IP = 192.168.1.20/1

; --- Pilihan TRIGGER_MODE Cetak Otomatis Master Box ---
; auto      : Memicu cetak jika SENSOR kardus lewat ATAU Totalizer bertambah
; sensor    : KHUSUS memicu cetak dari SENSOR kardus saja (TAG_SENSOR)
; totalizer : KHUSUS memicu cetak dari Perubahan Angka Totalizer saja
TRIGGER_MODE = auto

; --- NAMA TAG ROCKWELL ---
; Sesuaikan dengan nama variabel/TAG yang ada di Allen-Bradley
TAG_WEIGHT = Recent_Weight
TAG_QTY = Recent_Qty
TAG_TYPE = Product_Type
TAG_TOTALIZER = Totalizer_Box
TAG_SENSOR = _IO_EM_DI_00
